# libembedding-ng — Python bindings for libembedding
# Forked from https://github.com/pacifio/libembedding (C/C++ ONNX embedding core).
# Published on PyPI as `libembedding-ng`; imported as `libembedding`.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libembedding-ng"
version = "1.5.8"
description = "Fast ONNX-based text, image, and sparse embeddings for Python. 5-8x faster than fastembed."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "David Orel" },
]
keywords = [
    "embeddings",
    "text-embeddings",
    "onnx",
    "machine-learning",
    "nlp",
    "vector-search",
    "sentence-transformers",
    "fastembed",
    "reranking",
    "sparse-embeddings",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "cffi>=1.16",
    "numpy>=1.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-benchmark",
]

[project.urls]
Homepage = "https://github.com/dorel14/libembedding-ng"
Repository = "https://github.com/dorel14/libembedding-ng"
Issues = "https://github.com/dorel14/libembedding-ng/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libembedding = [
    "_cdefs.h",
    "py.typed",
    "*.dylib",
    "*.so",
    "*.dll",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    "../build/**",
]
verboseOutput = false
pythonVersion = "3.9"
typeCheckingMode = "basic"
# cffi generates dynamic types that pyright cannot infer
reportAttributeAccessIssue = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs = "none"
reportAssignmentType = "none"
reportPossiblyUnboundVariable = "none"

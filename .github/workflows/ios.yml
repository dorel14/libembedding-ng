name: iOS

# Roadmap T33c (D10): libembedding as an iOS library. scripts/build_ios.sh
# builds a self-contained libembedding.dylib for the device and for the
# simulator (arm64 both); the unit tests run on a booted simulator through
# `xcrun simctl spawn`, and both dylibs are packaged as libembedding.xcframework
# with the public headers. ONNX Runtime is the onnxruntime-c pod archive 1.30.0,
# the newest published for iOS. Models download through a static libcurl over
# mbedTLS, with Mozilla's CA bundle compiled in. The xcframework holds one
# dynamic libembedding.framework per SDK; the Swift package in examples/ios
# runs its XCTest suite against it with `xcodebuild test`.

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  ios:
    name: iOS (simulator tests + xcframework)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build for the simulator, with unit tests
        run: bash scripts/build_ios.sh iphonesimulator "$PWD/build-ios" tests

      - name: Build for the device
        run: bash scripts/build_ios.sh iphoneos "$PWD/build-ios"

      # test_embedding_parity downloads bge-small on the simulator: it checks
      # the static libcurl, mbedTLS and the embedded CA bundle end to end.
      - name: Run unit tests on a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devices.items(), reverse=True):
              if "iOS" in runtime:
                  for d in items:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit(0)
          sys.exit("no iPhone simulator available")')
          echo "simulator: $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          failed=0
          tests_dir="$PWD/build-ios/cmake-iphonesimulator/tests"
          ls -la "$tests_dir"
          for t in test_similarity test_pooling test_tokenizer test_model_registry test_struct_sizes test_sparse_gguf test_embedding_parity; do
            # CMake may build an iOS executable as an application bundle.
            exe="$tests_dir/$t"
            [ -d "$tests_dir/$t.app" ] && exe="$tests_dir/$t.app/$t"
            file "$exe"
            # simctl spawn passes SIMCTL_CHILD_* to the process without the prefix.
            if SIMCTL_CHILD_TMPDIR="$RUNNER_TEMP" \
               SIMCTL_CHILD_LEMBED_PARITY_REF="$PWD/python/tests/data/parity_bge_small_en_v15.json" \
               xcrun simctl spawn "$udid" "$exe" > "$t.log" 2>&1; then
              echo "PASS  $t: $(grep -oE '[0-9]+ passed[^[:cntrl:]]*' "$t.log" | tail -n 1)"
            else
              echo "FAIL  $t"; tail -n 30 "$t.log" | sed 's/^/  /'; failed=1
            fi
          done
          xcrun simctl shutdown "$udid"
          exit $failed

      # build_ios.sh wraps each SDK's dylib as libembedding.framework (headers,
      # module map, Info.plist, licence texts): an iOS app embeds a dynamic
      # library only inside a framework.
      - name: Package libembedding.xcframework
        run: |
          rm -rf build-ios/libembedding.xcframework
          xcodebuild -create-xcframework \
            -framework build-ios/framework-iphoneos/libembedding.framework \
            -framework build-ios/framework-iphonesimulator/libembedding.framework \
            -output build-ios/libembedding.xcframework
          (cd build-ios && zip -qry libembedding-ios.xcframework.zip libembedding.xcframework)
          find build-ios/libembedding.xcframework -maxdepth 3 | sort
          ls -la build-ios/*.zip

      # examples/ios is a Swift package whose binaryTarget is the xcframework:
      # it proves Swift can import the C module, link the framework and embed
      # text on a simulator (download, parity, mobile model limit).
      - name: Swift package tests on a simulator (xcodebuild test)
        run: |
          rm -rf examples/ios/libembedding.xcframework
          cp -R build-ios/libembedding.xcframework examples/ios/
          cd examples/ios
          scheme=$(xcodebuild -list -json | python3 -c '
          import json, sys
          schemes = json.load(sys.stdin)["workspace"]["schemes"]
          print(next((s for s in schemes if s.endswith("-Package")), schemes[0]))')
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devices.items(), reverse=True):
              if "iOS" in runtime:
                  for d in items:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit(0)
          sys.exit("no iPhone simulator available")')
          echo "scheme: $scheme, simulator: $udid"
          # TEST_RUNNER_* reaches the test process without the prefix.
          TEST_RUNNER_LEMBED_PARITY_REF="$GITHUB_WORKSPACE/python/tests/data/parity_bge_small_en_v15.json" \
          xcodebuild test \
            -scheme "$scheme" \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath "$RUNNER_TEMP/swift-dd" \
            | tee "$RUNNER_TEMP/xcodebuild-test.log" \
            | grep -E "Test Case|Test Suite|error:|warning: .*libembedding|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild-test.log"

      - uses: actions/upload-artifact@v4
        with:
          name: libembedding-ios-xcframework
          path: build-ios/libembedding-ios.xcframework.zip
          if-no-files-found: error

name: CI

on:
  pull_request:
    # `dev` too: feature branches are merged into `dev` first, and a PR there
    # would otherwise run no CI at all until the later PR to `main`.
    branches: [main, dev]

jobs:
  all:
    name: Full CI
    uses: ./.github/workflows/ci.yml
    with:
      python: "3.12"

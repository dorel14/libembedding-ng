name: Build Wheel Android (reusable)

# Roadmap T33b: Python wheels for Android (PEP 738, CPython 3.13+), built and
# tested by cibuildwheel. Called by android.yml on pull requests and by
# release.yml, which publishes the artifact (wheel-android) with the other
# platform wheels.
#
# The native libraries are built per ABI by scripts/build_android_libs.sh as
# the before-build step, including a static libcurl over mbedTLS
# (scripts/build_android_curl.sh). cibuildwheel tests the x86_64 wheel on its
# own emulator; arm64 is built only, since an x86_64 runner has no fast arm64
# emulator. cffi and numpy have no Android wheels on PyPI; Chaquopy's index
# provides them.

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""

env:
  ONNXRUNTIME_VERSION: "1.31.0"
  ANDROID_API: "24"

jobs:
  wheel:
    name: Python wheels (Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and test Android wheels
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: cp313-*
          CIBW_ARCHS_ANDROID: arm64_v8a x86_64
          # cibuildwheel takes the minimum API level, hence the android_<N>
          # wheel tag, from ANDROID_API_LEVEL (default 24), and the
          # before-build script compiles the native libraries for the same
          # variable: both follow ANDROID_API. The before-build step runs on
          # the host and inherits ONNXRUNTIME_VERSION from env.
          ANDROID_API_LEVEL: ${{ env.ANDROID_API }}
          CIBW_BUILD_FRONTEND: build
          CIBW_BEFORE_BUILD_ANDROID: bash {project}/scripts/build_android_libs.sh
          CIBW_ENVIRONMENT_ANDROID: PIP_EXTRA_INDEX_URL=https://chaquo.com/pypi-13.1
          # No repair: every native library is already in the package, linked
          # to its siblings through RUNPATH=$ORIGIN, and the wheel is already
          # tagged android_24_*. auditwheel only searches the NDK and failed
          # with "libggml-base.so could not be located". The emulator test
          # catches any dependency that would really be missing.
          CIBW_REPAIR_WHEEL_COMMAND_ANDROID: ""
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: python/tests
          # Offline tests, plus one real model download (download_smoke):
          # the library downloads through its own static libcurl over mbedTLS.
          CIBW_TEST_COMMAND: python -m pytest python/tests -m "not network or download_smoke" -q -p no:cacheprovider
          CIBW_BUILD_VERBOSITY: 1
        run: |
          python -m pip install cibuildwheel==4.3.5
          cibuildwheel python --output-dir wheelhouse
          ls -la wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-android
          path: wheelhouse/*.whl
          if-no-files-found: error

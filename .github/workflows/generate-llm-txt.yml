name: Generate LLM Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'examples/**'
      - 'scripts/generate_llm_docs.py'
      - '.github/workflows/generate-llm-txt.yml'
  workflow_dispatch:

jobs:
  generate-llm-txt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate llm.txt / llm_full.txt
        run: python scripts/generate_llm_docs.py

      - name: Commit generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add llm.txt llm_full.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: regenerate llm.txt / llm_full.txt [skip ci]" && git push origin main)
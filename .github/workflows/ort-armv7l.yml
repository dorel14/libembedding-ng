name: ORT armv7l (cost measurement)

# Roadmap T33d (D10), step 0: ONNX Runtime publishes no armv7l build, so a
# 32-bit Raspberry Pi OS wheel needs ORT compiled from source. ORT supports
# ARM32 only by cross-compiling (cmake/detect_onnxruntime_target_platform.cmake),
# so the first job cross-compiles the release used everywhere else for
# arm-linux-gnueabihf (ARMv7-A, NEON, hard float) on an x64 runner. It
# measures what the decision needs: build time, library size and the glibc
# symbol versions it requires (hence the manylinux tag). The result is cached
# per ORT version and toolchain, so only the first run pays the build
# (36 min on 4 cores, measured 2026-11-13).
#
# The second job loads the library in an arm32v7 Debian 12 container under
# QEMU (binfmt): a userland close to Raspberry Pi OS 12, and a recent QEMU.
# GitHub's ARM runners cannot run AArch32 code natively. Nothing is
# published; the library is kept 7 days as an artifact.
#
# --no_telemetry: since 1.31 a source build enables ORT's 1DS telemetry by
# default (hashed device id, model file name and hashes, run durations, sent
# to mobile.events.data.microsoft.com), along with its own copies of curl and
# mbedTLS. A library embedded in users' applications must not phone home.
#
# Ubuntu 22.04: its cross toolchain is GCC 11 over glibc 2.35, below the 2.36
# of Raspberry Pi OS 12 (bookworm).

on:
  push:
    branches: ["ci/armv7l-*"]
    paths: [".github/workflows/ort-armv7l.yml"]
  workflow_dispatch:

env:
  ONNXRUNTIME_VERSION: "1.31.0"
  # protoc runs on the build machine; ORT 1.31.0 pins protobuf 33.6 (cmake/deps.txt).
  PROTOC_VERSION: "33.6"
  ARM_FLAGS: "-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard"

jobs:
  ort:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Install the armhf cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-arm-linux-gnueabihf ninja-build
          arm-linux-gnueabihf-g++ --version | head -1
          cmake --version | head -1
          nproc; free -g

      - name: Write the toolchain file
        run: |
          cat > armhf.cmake <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR armv7l)
          set(CMAKE_C_COMPILER arm-linux-gnueabihf-gcc)
          set(CMAKE_CXX_COMPILER arm-linux-gnueabihf-g++)
          set(CMAKE_C_FLAGS_INIT "$ARM_FLAGS")
          set(CMAKE_CXX_FLAGS_INIT "$ARM_FLAGS")
          set(CMAKE_FIND_ROOT_PATH /usr/arm-linux-gnueabihf)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          EOF

      - name: Restore a cached build
        id: cache
        uses: actions/cache@v4
        with:
          path: out
          # Bump the trailing number when the build.py arguments change.
          key: ort-armv7l-${{ env.ONNXRUNTIME_VERSION }}-${{ hashFiles('armhf.cmake') }}-ubuntu22.04-2

      - name: Fetch ONNX Runtime sources and a host protoc
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v$ONNXRUNTIME_VERSION" \
            https://github.com/microsoft/onnxruntime.git ort
          curl -fsSL --retry 3 -o protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-linux-x86_64.zip"
          unzip -q protoc.zip -d protoc
          protoc/bin/protoc --version

      - name: Cross-compile ONNX Runtime (timed)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          start=$(date +%s)
          python3 ort/tools/ci_build/build.py \
            --build_dir ort-build --config Release \
            --update --build --parallel --skip_tests \
            --build_shared_lib --compile_no_warning_as_error \
            --no_telemetry \
            --cmake_generator Ninja \
            --path_to_protoc_exe "$PWD/protoc/bin/protoc" \
            --cmake_extra_defines \
              CMAKE_TOOLCHAIN_FILE="$PWD/armhf.cmake" \
              onnxruntime_BUILD_UNIT_TESTS=OFF
          end=$(date +%s)
          mkdir -p out/lib out/include
          cp -P ort-build/Release/libonnxruntime.so* out/lib/
          cp ort/include/onnxruntime/core/session/*.h out/include/
          cp ort/LICENSE ort/ThirdPartyNotices.txt out/
          echo "$((end - start))" > out/build-seconds

      - name: Inspect the library
        run: |
          lib="out/lib/libonnxruntime.so.$ONNXRUNTIME_VERSION"
          file "$lib"
          arm-linux-gnueabihf-readelf -A "$lib" | grep -E "Tag_CPU_arch|Tag_FP_arch|Tag_Advanced_SIMD|Tag_ABI_VFP_args"
          arm-linux-gnueabihf-objdump -p "$lib" | grep NEEDED
          if grep -q -a "events.data.microsoft.com" "$lib"; then
            echo "::error::$lib still contains the telemetry collector URL"; exit 1
          fi
          glibc=$(arm-linux-gnueabihf-objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          cxx=$(arm-linux-gnueabihf-objdump -T "$lib" | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1)
          arm-linux-gnueabihf-strip -o /tmp/stripped.so "$lib"
          secs=$(cat out/build-seconds)
          {
            echo "### ONNX Runtime $ONNXRUNTIME_VERSION for armv7l"
            echo ""
            echo "- build: $((secs / 60)) min $((secs % 60)) s (cache hit: ${{ steps.cache.outputs.cache-hit == 'true' }})"
            echo "- size: $(stat -c %s "$lib") bytes, stripped $(stat -c %s /tmp/stripped.so) bytes"
            echo "- highest symbol versions: $glibc, $cxx"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the smoke test
        run: |
          cat > smoke.c <<'EOF'
          #include <stdio.h>
          #include "onnxruntime_c_api.h"
          #define STEP(s) do { fprintf(stderr, "step: %s\n", s); fflush(stderr); } while (0)
          int main(void) {
              STEP("OrtGetApiBase");
              const OrtApiBase* base = OrtGetApiBase();
              STEP(base->GetVersionString());
              const OrtApi* api = base->GetApi(ORT_API_VERSION);
              if (!api) { puts("GetApi failed"); return 1; }
              STEP("CreateEnv");
              OrtEnv* env = NULL;
              OrtStatus* st = api->CreateEnv(ORT_LOGGING_LEVEL_WARNING, "smoke", &env);
              if (st) { puts(api->GetErrorMessage(st)); return 1; }
              STEP("CreateSessionOptions");
              OrtSessionOptions* so = NULL;
              st = api->CreateSessionOptions(&so);
              if (st) { puts(api->GetErrorMessage(st)); return 1; }
              api->ReleaseSessionOptions(so);
              api->ReleaseEnv(env);
              printf("ONNX Runtime %s: env and session options created\n", base->GetVersionString());
              return 0;
          }
          EOF
          arm-linux-gnueabihf-gcc $ARM_FLAGS -I out/include smoke.c \
            -L out/lib -lonnxruntime -Wl,-rpath,'$ORIGIN/lib' -o out/smoke

      - uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-linux-armv7l-${{ env.ONNXRUNTIME_VERSION }}
          path: out/
          retention-days: 7

  smoke:
    needs: ort
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - uses: actions/download-artifact@v4
        with:
          name: onnxruntime-linux-armv7l-${{ env.ONNXRUNTIME_VERSION }}
          path: out
      - name: Load it in an arm32v7 Debian 12 container
        run: |
          chmod +x out/smoke
          docker run --rm --platform linux/arm/v7 -v "$PWD/out:/out" -w /out \
            arm32v7/debian:bookworm sh -c '
              uname -m
              ldd --version | head -1
              ./smoke'

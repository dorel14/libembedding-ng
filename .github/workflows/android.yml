name: Android

# Roadmap T33a (D10): libembedding as a native Android library.
# arm64-v8a is the target ABI; x86_64 is built as well because it is the only
# ABI an emulator runs at usable speed on a GitHub runner (KVM), so the unit
# tests exercise bionic, dlopen of the ggml CPU variants and the missing /tmp
# there. ONNX Runtime comes from its official Android AAR on Maven Central.
# Downloading is off (LIBEMBEDDING_NO_DOWNLOAD): models are passed by path.
# CMakeLists.txt gives Android binaries RUNPATH=$ORIGIN: the linker of the ARM
# translation layer on x86_64 emulators ignores LD_LIBRARY_PATH, so without it
# arm64 binaries cannot find libllama.so.

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

env:
  ONNXRUNTIME_VERSION: "1.31.0"
  ANDROID_API: "24"

jobs:
  build:
    name: build (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ONNX Runtime Android AAR
        run: |
          aar="onnxruntime-android-${ONNXRUNTIME_VERSION}.aar"
          curl -fsSL -o "$aar" \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ONNXRUNTIME_VERSION}/$aar"
          mkdir -p ort-aar ort/include ort/lib
          unzip -q "$aar" -d ort-aar
          cp ort-aar/headers/*.h ort/include/
          cp "ort-aar/jni/${{ matrix.abi }}/libonnxruntime.so" ort/lib/
          ls -la ort/include ort/lib

      - name: Configure
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBEMBEDDING_NO_DOWNLOAD=ON \
            -DLIBEMBEDDING_BUILD_SHARED=ON \
            -DLIBEMBEDDING_BUILD_TESTS=ON \
            -DLIBEMBEDDING_BUILD_EXAMPLES=OFF \
            -DLIBEMBEDDING_BUILD_BENCHMARKS=OFF \
            -DONNXRuntime_INCLUDE_DIR="$PWD/ort/include" \
            -DONNXRuntime_LIBRARY="$PWD/ort/lib/libonnxruntime.so"

      - name: Build library and unit tests
        run: |
          cmake --build build --parallel 4 --target embedding_shared \
            test_similarity test_pooling test_tokenizer test_model_registry \
            test_struct_sizes test_sparse_gguf

      - name: Stage binaries
        run: |
          mkdir -p stage
          for t in test_similarity test_pooling test_tokenizer test_model_registry test_struct_sizes test_sparse_gguf; do
            cp "build/tests/$t" stage/
          done
          find build -name '*.so' -exec cp {} stage/ \;
          cp ort/lib/libonnxruntime.so stage/
          ls -la stage
          # Every shipped object must target the requested ABI.
          file stage/libembedding.so stage/libggml-cpu-*.so | sed 's/,.*BuildID.*//'

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: stage/
          if-no-files-found: error

  test-emulator:
    name: unit tests (x86_64 emulator)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-x86_64
          path: stage/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run unit tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/android_run_tests.sh stage

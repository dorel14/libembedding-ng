name: Release

# Versioning is handled by python-semantic-release. On every push to `main`
# (or manual dispatch) semantic-release inspects the commits since the last
# tag:
#   * feat:        -> minor bump
#   * fix/perf:    -> patch bump
#   * BREAKING:    -> major bump
# It stamps the version into python/pyproject.toml, commits, tags (v{version}),
# pushes everything and opens a GitHub release.
#
# The wheel build (all platforms) and the PyPI upload are chained in the *same*
# workflow run via job dependencies, so we never rely on a tag push firing
# another workflow (the default GITHUB_TOKEN cannot do that anyway). A
# "[skip ci]" marker is put on the bump commit so the push-back to `main`
# cannot re-trigger this workflow.

# Flow: check (lint+encoding) → test (C++ + Python) → version (semantic-release) → build → publish
# Version is determined AFTER tests pass.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------
  # 1) Fast static checks (encoding, lint) — run first, no system deps needed
  # -----------------------------------------------------------------------
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Encoding check
        run: |
          if grep -rlP '^\xEF\xBB\xBF' . --include='*.py' --include='*.h' --include='*.hpp' --include='*.c' --include='*.cpp' --include='CMakeLists.txt' --exclude-dir=third_party --exclude-dir=.git; then
            echo "UTF-8 BOM found"
            exit 1
          fi

      - name: Lint and typecheck Python sources
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright
          ruff check python/src
          pyright python/src

  # -----------------------------------------------------------------------
  # 2) Run tests BEFORE version bump
  # -----------------------------------------------------------------------
  test:
    name: Tests
    needs: check
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_VERSION: "1.20.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
          curl -L "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNXRUNTIME_VERSION }}/onnxruntime-linux-x64-${{ env.ONNXRUNTIME_VERSION }}.tgz" | tar xz
          echo "ONNXRUNTIME_ROOT=$PWD/onnxruntime-linux-x64-${{ env.ONNXRUNTIME_VERSION }}" >> "$GITHUB_ENV"

      - name: Configure and build C++ tests
        env:
          ONNXRUNTIME_ROOT: ${{ env.ONNXRUNTIME_ROOT }}
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBEMBEDDING_BUILD_TESTS=ON \
            -DLIBEMBEDDING_BUILD_EXAMPLES=OFF \
            -DLIBEMBEDDING_BUILD_BENCHMARKS=OFF \
            -DLIBEMBEDDING_BUILD_SHARED=ON \
            -DLIBEMBEDDING_INTEGRATION_TESTS=OFF \
            -DONNXRUNTIME_ROOT="$ONNXRUNTIME_ROOT"
          cmake --build . --parallel 2 --target test_model_registry test_pooling test_similarity test_local_loading

      - name: Run C++ unit tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Build shared library for Python tests
        env:
          ONNXRUNTIME_ROOT: ${{ env.ONNXRUNTIME_ROOT }}
        run: |
          cd build
          cmake --build . --parallel 2 --target embedding_shared --config Release

      - name: Copy shared libraries for Python tests
        run: |
          ext=".so"
          ort_lib_dir="$ONNXRUNTIME_ROOT/lib"
          curl_lib_dir="/usr/lib/x86_64-linux-gnu"
          mkdir -p python/src/libembedding
          cp "build/libembedding${ext}" python/src/libembedding/
          cp "${ort_lib_dir}/libonnxruntime${ext}" python/src/libembedding/ || true
          cp "${ort_lib_dir}/libonnxruntime_providers_shared${ext}" python/src/libembedding/ || true
          cp "${curl_lib_dir}/libcurl${ext}" python/src/libembedding/ || true
          ls -la python/src/libembedding/

      - name: Run Python tests
        env:
          ONNXRUNTIME_ROOT: ${{ env.ONNXRUNTIME_ROOT }}
        run: |
          cd python
          pip install -e .[dev]
          pytest tests/ -v --timeout=120 --cov=libembedding --cov-fail-under=40

  # -----------------------------------------------------------------------
  # 3) Determine the next version and create the release (AFTER tests pass)
  # -----------------------------------------------------------------------
  version:
    name: Semantic Release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      released: ${{ steps.resolve.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semantic-release
        run: |
          python -m pip install --upgrade pip
          # v10.5.0+ supports operand-less version_variables (needed for CMake/config.h)
          # v10.6.0+ supports file replacement via * pattern
          pip install "python-semantic-release>=10.6.0"

      - name: Detect next release
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT="$(semantic-release version --print 2>/dev/null || true)"
          LAST="$(semantic-release version --print-last-released 2>/dev/null || true)"
          echo "detected_next=${NEXT}" >> "$GITHUB_ENV"
          echo "detected_last=${LAST}" >> "$GITHUB_ENV"
          if [[ "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$NEXT" != "$LAST" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEXT" >> "$GITHUB_OUTPUT"
            echo "Next release: ${NEXT} (last: ${LAST})"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "No release needed on this push (next=${NEXT}, last=${LAST})."
          fi

      - name: Create release
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.detect.outputs.released }}" = "true" ]; then
            NEXT="${{ steps.detect.outputs.version }}"
            echo "Stamping version ${NEXT} with python-semantic-release..."
            semantic-release version
            echo "Syncing version ${NEXT} to remaining headers/comments..."
            find include -type f \( -name "*.h" -o -name "*.hpp" \) -not -path "*/third_party/*" -exec sed -i 's/^ \* Version: [0-9][0-9.]*/ * Version: '"${NEXT}"'/' {} \;
            find python/src -type f -name "*.py" -exec sed -i 's/^Version: [0-9][0-9.]*/Version: '"${NEXT}"'/' {} \;
            sed -i 's/(v[0-9][0-9.]*)/(v'"${NEXT}"')/' python/src/libembedding/_cdefs.h
            sed -i 's/^> \*\*Version courante\*\* : [0-9][0-9.]*$/> **Version courante** : '"${NEXT}"'/' AGENTS.md
            # Verify all versions match after bump
            PY=$(grep -oP '^version = "\K[^"]+' python/pyproject.toml)
            C=$(grep -oP 'LIBEMBEDDING_VERSION_STRING "\K[^"]+' include/libembedding/config.h)
            CMAKE=$(grep -oP '^\s*VERSION\s+\K[0-9][0-9.]*' CMakeLists.txt | head -n1)
            if [ -z "$CMAKE" ]; then
              CMAKE=$(grep -oP 'set\(LIBEMBEDDING_VERSION "\K[0-9][0-9.]*' CMakeLists.txt | head -n1)
            fi
            if [ "$PY" != "$C" ] || [ "$PY" != "$CMAKE" ]; then
              echo "Version mismatch after bump! PY=$PY C=$C CMAKE=$CMAKE"
              exit 1
            fi
            echo "All versions synced: ${PY}"
            # The bump commit is tagged vX.Y.Z - capture it for downstream jobs.
            TAG="$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1)"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "Created release: ${TAG}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No release needed on this push."
          fi

  # -----------------------------------------------------------------------
  # 4) Build the platform wheels for every supported OS (matrix)
  # -----------------------------------------------------------------------
  build:
    name: Build wheel (${{ matrix.name }})
    needs: [version]
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/build-wheel.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}
      ref: ${{ needs.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            python: "3.12"
          - os: macos-14
            name: macos-arm64
            python: "3.12"
          - os: windows-2022
            name: windows-x86_64
            python: "3.12"

  # -----------------------------------------------------------------------
  # 5) Collect every wheel and publish them to PyPI
  # -----------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [version, build]
    if: always() && needs.build.result == 'success' && needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: List wheels
        run: ls -la dist/

      - name: Skip if version already on PyPI
        id: check
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "VERSION output is empty, cannot check PyPI."
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE="$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/libembedding-ng/${VERSION}/json")"
          if [ "$CODE" = "200" ]; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already present on PyPI - skipping upload."
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
            echo "PyPI check HTTP ${CODE} - publishing ${VERSION}."
          fi

      - name: Publish to PyPI
        if: steps.check.outputs.already_exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/

name: C++ Unit Tests

on:
  pull_request:
    # `dev` too: see build.yml.
    branches: [main, dev]
  push:
    branches: [main]
  workflow_call:

env:
  ONNXRUNTIME_VERSION: "1.31.0"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          # 24.04, not 22.04: ggml's armv9.2 CPU variants need GCC 14, which
          # 24.04 ships in its archive. On 22.04 it came from the
          # ubuntu-toolchain-r PPA, and every Launchpad outage failed the job.
          # Test-only binaries: the aarch64 wheel is built in manylinux_2_28.
          - os: ubuntu-24.04-arm
            name: linux-aarch64
          - os: windows-2022
            name: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for cffi build deps)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cffi numpy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
          case "$(uname -m)" in
            x86_64)  ort_arch=x64 ;;
            aarch64) ort_arch=aarch64 ;;
            *) echo "ERROR: unsupported Linux architecture $(uname -m)"; exit 1 ;;
          esac
          # ggml's armv9.2 CPU variants need -march=armv9.2-a+sme: GCC 14,
          # from the Ubuntu 24.04 archive (no PPA, see the matrix).
          if [ "$ort_arch" = aarch64 ]; then
            sudo apt-get install -y gcc-14 g++-14
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          fi
          curl -fL "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNXRUNTIME_VERSION }}/onnxruntime-linux-${ort_arch}-${{ env.ONNXRUNTIME_VERSION }}.tgz" | tar xz
          echo "ONNXRUNTIME_ROOT=$PWD/onnxruntime-linux-${ort_arch}-${{ env.ONNXRUNTIME_VERSION }}" >> "$GITHUB_ENV"

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake -y
          & "C:\vcpkg\vcpkg.exe" install curl:x64-windows
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNXRUNTIME_VERSION }}/onnxruntime-win-x64-${{ env.ONNXRUNTIME_VERSION }}.zip"
          Invoke-WebRequest -Uri $url -OutFile "onnxruntime-win-x64.zip"
          Expand-Archive -Path "onnxruntime-win-x64.zip" -DestinationPath "onnxruntime-win-x64"
          $inner = Get-ChildItem -Path "onnxruntime-win-x64" -Directory | Where-Object { $_.Name -like "onnxruntime-win-x64*" } | Select-Object -First 1
          if ($inner) {
            Move-Item "$($inner.FullName)/*" "onnxruntime-win-x64/" -Force
            Remove-Item $inner.FullName
          }
          echo "ONNXRUNTIME_ROOT=${{ github.workspace }}\onnxruntime-win-x64" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          echo "CURL_INCLUDE_DIR=C:\vcpkg\installed\x64-windows\include" >> $env:GITHUB_ENV
          echo "CURL_LIBRARY=C:\vcpkg\installed\x64-windows\lib\libcurl.lib" >> $env:GITHUB_ENV

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ONNXRUNTIME_ROOT: ${{ env.ONNXRUNTIME_ROOT }}
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBEMBEDDING_BUILD_TESTS=ON \
            -DLIBEMBEDDING_BUILD_EXAMPLES=OFF \
            -DLIBEMBEDDING_BUILD_BENCHMARKS=OFF \
            -DLIBEMBEDDING_BUILD_SHARED=OFF \
            -DLIBEMBEDDING_INTEGRATION_TESTS=OFF \
            -DONNXRUNTIME_ROOT="$ONNXRUNTIME_ROOT"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ONNXRUNTIME_ROOT: ${{ env.ONNXRUNTIME_ROOT }}
          CURL_INCLUDE_DIR: ${{ env.CURL_INCLUDE_DIR }}
          CURL_LIBRARY: ${{ env.CURL_LIBRARY }}
          CMAKE_TOOLCHAIN_FILE: ${{ env.CMAKE_TOOLCHAIN_FILE }}
        run: |
          mkdir build
          Set-Location build
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DLIBEMBEDDING_BUILD_TESTS=ON `
            -DLIBEMBEDDING_BUILD_EXAMPLES=OFF `
            -DLIBEMBEDDING_BUILD_BENCHMARKS=OFF `
            -DLIBEMBEDDING_BUILD_SHARED=OFF `
            -DLIBEMBEDDING_INTEGRATION_TESTS=OFF `
            -DONNXRUNTIME_ROOT="$env:ONNXRUNTIME_ROOT" `
            -DCURL_INCLUDE_DIR="$env:CURL_INCLUDE_DIR" `
            -DCURL_LIBRARY="$env:CURL_LIBRARY" `
            -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE"

      - name: Build tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ONNXRUNTIME_ROOT: ${{ env.ONNXRUNTIME_ROOT }}
        run: |
          cd build
          cmake --build . --parallel 2 --target test_model_registry test_pooling test_similarity test_local_loading test_cache test_struct_sizes test_cpp_wrappers test_quantization_auto test_autotune_core test_tokenizer test_gguf_inspect test_sparse_gguf

      - name: Build tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ONNXRUNTIME_ROOT: ${{ env.ONNXRUNTIME_ROOT }}
        run: |
          Set-Location build
          cmake --build . --parallel --target test_model_registry test_pooling test_similarity test_local_loading test_cache test_struct_sizes test_cpp_wrappers test_quantization_auto test_autotune_core test_tokenizer test_gguf_inspect test_sparse_gguf --config Release

      - name: Run C++ unit tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd build
          ctest --output-on-failure

      - name: Run C++ unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location build
          ctest --output-on-failure -C Release

      # The shipped binaries must run on any x86-64 CPU (no AVX2 assumed in
      # libembedding's own code; ggml picks its CPU variant at run time).
      # Intel SDE emulates older and newer CPUs: an instruction the emulated
      # CPU lacks stops the test with SDE-ERROR and a non-zero exit code.
      # nhm = Nehalem (SSE4.2), snb = Sandy Bridge (AVX), hsw = Haswell (AVX2),
      # skx = Skylake-X (AVX-512), icl = Ice Lake (AVX-512 VNNI).
      # By using Intel SDE you accept its license (shipped in the archive).
      - name: Run unit tests on emulated CPUs (Intel SDE, Linux)
        # SDE emulates x86 CPUs only.
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: |
          curl -fsSL -o sde.tar.xz https://downloadmirror.intel.com/859732/sde-external-9.58.0-2025-06-16-lin.tar.xz
          echo "f849acecad4c9b108259c643b2688fd65c35723cd23368abe5dd64b917cc18c0  sde.tar.xz" | sha256sum -c -
          tar -xf sde.tar.xz
          sde=$(ls -d sde-external-*-lin)/sde64
          failed=0
          for cpu in nhm snb hsw skx icl; do
            for t in test_similarity test_pooling test_tokenizer test_sparse_gguf; do
              if out=$("$sde" -$cpu -- "build/tests/$t" 2>&1); then
                echo "PASS  -$cpu  $t: $(echo "$out" | grep -E '[0-9]+ passed' | tail -1)"
              else
                echo "FAIL  -$cpu  $t"; echo "$out" | grep -E 'SDE-ERROR|FAIL' | head -5; failed=1
              fi
            done
          done
          exit $failed

      - name: Run unit tests on emulated CPUs (Intel SDE, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 30
        run: |
          # Every phase is timestamped and bounded: a silent hang must show
          # where it happened instead of eating the step timeout.
          function Log($msg) { Write-Host ("[{0:HH:mm:ss}] {1}" -f (Get-Date), $msg) }
          $ProgressPreference = "SilentlyContinue"
          Log "downloading Intel SDE"
          curl.exe -fsSL --retry 3 --connect-timeout 30 --max-time 300 -o sde.tar.xz `
            "https://downloadmirror.intel.com/859732/sde-external-9.58.0-2025-06-16-win.tar.xz"
          if ($LASTEXITCODE -ne 0) { throw "Intel SDE download failed (curl exit $LASTEXITCODE)" }
          if ((Get-FileHash sde.tar.xz -Algorithm SHA256).Hash -ne "EBB8B3B63FCB0B6C1F9721118BA4883703D2AED9E0DB2DEFED4E44FBA78D9CA9") {
            throw "Intel SDE checksum mismatch"
          }
          # The runner's bsdtar hangs on .tar.xz (no built-in xz there), so
          # 7-Zip decompresses and bsdtar only unpacks the plain tar.
          Log "decompressing with 7z"
          7z x -y sde.tar.xz | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Intel SDE decompression failed (7z exit $LASTEXITCODE)" }
          Log "extracting sde.tar"
          & "$env:SystemRoot\System32\tar.exe" -xf sde.tar
          if ($LASTEXITCODE -ne 0) { throw "Intel SDE extraction failed (tar exit $LASTEXITCODE)" }
          $sde = (Resolve-Path "sde-external-*-win\sde.exe").Path
          $bin = (Resolve-Path "build\tests\Release").Path
          Log "sde: $sde, tests: $bin"
          # A failing or hung test is reported and counted, not thrown on.
          # Each run gets its own timeout: a hang must not eat the job limit.
          $ErrorActionPreference = "Continue"
          $failed = $false
          foreach ($cpu in "nhm", "snb", "hsw", "skx", "icl") {
            foreach ($t in "test_similarity", "test_pooling", "test_tokenizer", "test_sparse_gguf") {
              Log "start -$cpu $t"
              $p = Start-Process -FilePath $sde -NoNewWindow -PassThru `
                -ArgumentList "-$cpu", "--", "$bin\$t.exe" `
                -RedirectStandardOutput "sde-out.txt" -RedirectStandardError "sde-err.txt"
              if (-not $p.WaitForExit(180000)) {
                $p.Kill($true)
                Write-Host "FAIL  -$cpu  $t (timeout)"
                Get-Content sde-out.txt, sde-err.txt -Tail 10 | ForEach-Object { Write-Host "  $_" }
                $failed = $true
                continue
              }
              $out = Get-Content sde-out.txt, sde-err.txt
              if ($p.ExitCode -eq 0) {
                $sum = $out | Select-String "\d+ passed" | Select-Object -Last 1
                Write-Host "PASS  -$cpu  ${t}: $sum"
              } else {
                Write-Host "FAIL  -$cpu  $t (exit $($p.ExitCode))"
                $out | Select-String "SDE-ERROR|FAIL" | Select-Object -First 5 | ForEach-Object { Write-Host "  $_" }
                $failed = $true
              }
            }
          }
          if ($failed) { exit 1 }
          exit 0

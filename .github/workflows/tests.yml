name: C++ Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

env:
  ONNXRUNTIME_VERSION: "1.20.1"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-2022
            name: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for cffi build deps)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cffi numpy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
          curl -L "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNXRUNTIME_VERSION }}/onnxruntime-linux-x64-${{ env.ONNXRUNTIME_VERSION }}.tgz" | tar xz
          echo "ONNXRUNTIME_ROOT=$PWD/onnxruntime-linux-x64-${{ env.ONNXRUNTIME_VERSION }}" >> "$GITHUB_ENV"

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake -y
          & "C:\vcpkg\vcpkg.exe" install curl:x64-windows
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNXRUNTIME_VERSION }}/onnxruntime-win-x64-${{ env.ONNXRUNTIME_VERSION }}.zip"
          Invoke-WebRequest -Uri $url -OutFile "onnxruntime-win-x64.zip"
          Expand-Archive -Path "onnxruntime-win-x64.zip" -DestinationPath "onnxruntime-win-x64"
          $inner = Get-ChildItem -Path "onnxruntime-win-x64" -Directory | Where-Object { $_.Name -like "onnxruntime-win-x64*" } | Select-Object -First 1
          if ($inner) {
            Move-Item "$($inner.FullName)/*" "onnxruntime-win-x64/" -Force
            Remove-Item $inner.FullName
          }
          echo "ONNXRUNTIME_ROOT=${{ github.workspace }}\onnxruntime-win-x64" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          echo "CURL_INCLUDE_DIR=C:\vcpkg\installed\x64-windows\include" >> $env:GITHUB_ENV
          echo "CURL_LIBRARY=C:\vcpkg\installed\x64-windows\lib\libcurl.lib" >> $env:GITHUB_ENV

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ONNXRUNTIME_ROOT: ${{ env.ONNXRUNTIME_ROOT }}
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBEMBEDDING_BUILD_TESTS=ON \
            -DLIBEMBEDDING_BUILD_EXAMPLES=OFF \
            -DLIBEMBEDDING_BUILD_BENCHMARKS=OFF \
            -DLIBEMBEDDING_BUILD_SHARED=OFF \
            -DLIBEMBEDDING_INTEGRATION_TESTS=OFF \
            -DONNXRUNTIME_ROOT="$ONNXRUNTIME_ROOT"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ONNXRUNTIME_ROOT: ${{ env.ONNXRUNTIME_ROOT }}
          CURL_INCLUDE_DIR: ${{ env.CURL_INCLUDE_DIR }}
          CURL_LIBRARY: ${{ env.CURL_LIBRARY }}
          CMAKE_TOOLCHAIN_FILE: ${{ env.CMAKE_TOOLCHAIN_FILE }}
        run: |
          mkdir build
          Set-Location build
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DLIBEMBEDDING_BUILD_TESTS=ON `
            -DLIBEMBEDDING_BUILD_EXAMPLES=OFF `
            -DLIBEMBEDDING_BUILD_BENCHMARKS=OFF `
            -DLIBEMBEDDING_BUILD_SHARED=OFF `
            -DLIBEMBEDDING_INTEGRATION_TESTS=OFF `
            -DONNXRUNTIME_ROOT="$env:ONNXRUNTIME_ROOT" `
            -DCURL_INCLUDE_DIR="$env:CURL_INCLUDE_DIR" `
            -DCURL_LIBRARY="$env:CURL_LIBRARY" `
            -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE"

      - name: Build tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ONNXRUNTIME_ROOT: ${{ env.ONNXRUNTIME_ROOT }}
        run: |
          cd build
          cmake --build . --parallel 2 --target test_model_registry test_pooling test_similarity test_local_loading

      - name: Build tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ONNXRUNTIME_ROOT: ${{ env.ONNXRUNTIME_ROOT }}
        run: |
          Set-Location build
          cmake --build . --parallel --target test_model_registry test_pooling test_similarity test_local_loading --config Release

      - name: Run C++ unit tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd build
          ctest --output-on-failure

      - name: Run C++ unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location build
          ctest --output-on-failure -C Release

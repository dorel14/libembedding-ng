name: Build Wheel (reusable)

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""

env:
  ONNXRUNTIME_VERSION: "1.31.0"

jobs:
  build:
    name: ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python }}

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cffi numpy build wheel pytest pytest-timeout ruff pyright pytest-cov

      - name: Lint and typecheck Python sources
        shell: bash
        run: |
          ruff check python/src
          pyright python/src

      # ── Platform-specific system dependencies ────────────────────
      # Linux aarch64 builds in a manylinux_2_28 container instead (below):
      # ggml's armv9.2 variants need GCC 14, and a GCC 14 on this runner would
      # link a libstdc++ that pushes the wheel to manylinux_2_39, which the
      # runner itself cannot install.
      # Downloads go through a static libcurl over mbedTLS linked into
      # libembedding.so: the system libcurl would make auditwheel graft some
      # thirty libraries (OpenSSL, krb5, LDAP, libssh, several under the LGPL).
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          curl -fL "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNXRUNTIME_VERSION }}/onnxruntime-linux-x64-${{ env.ONNXRUNTIME_VERSION }}.tgz" | tar xz
          echo "ONNXRUNTIME_ROOT=$PWD/onnxruntime-linux-x64-${{ env.ONNXRUNTIME_VERSION }}" >> "$GITHUB_ENV"
          bash scripts/build_curl_mbedtls.sh "$RUNNER_TEMP/curl"
          echo "CURL_PREFIX=$RUNNER_TEMP/curl/curl-prefix" >> "$GITHUB_ENV"

      - name: Build and repair wheel in manylinux_2_28 (Linux aarch64)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          docker run --rm -v "$PWD:/io" \
            -e ONNXRUNTIME_VERSION="${{ env.ONNXRUNTIME_VERSION }}" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            quay.io/pypa/manylinux_2_28_aarch64 \
            bash /io/scripts/build_wheel_manylinux.sh

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake curl
          # Oldest macOS the wheel supports. ONNX Runtime 1.31's dylib is
          # built for 14.0, so nothing lower can load it. Used by CMake
          # (MACOSX_DEPLOYMENT_TARGET) and for the wheel's platform tag.
          echo "MACOS_MIN_VERSION=14.0" >> "$GITHUB_ENV"
          if [ "$(uname -m)" = "arm64" ]; then
            curl -L "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNXRUNTIME_VERSION }}/onnxruntime-osx-arm64-${{ env.ONNXRUNTIME_VERSION }}.tgz" | tar xz
            echo "ONNXRUNTIME_ROOT=$PWD/onnxruntime-osx-arm64-${{ env.ONNXRUNTIME_VERSION }}" >> "$GITHUB_ENV"
          else
            curl -L "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNXRUNTIME_VERSION }}/onnxruntime-osx-x86_64-${{ env.ONNXRUNTIME_VERSION }}.tgz" | tar xz
            echo "ONNXRUNTIME_ROOT=$PWD/onnxruntime-osx-x86_64-${{ env.ONNXRUNTIME_VERSION }}" >> "$GITHUB_ENV"
          fi

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake -y

          # Install curl via vcpkg (MSVC-compatible import library + headers)
          & "C:\vcpkg\vcpkg.exe" install curl:x64-windows

          # Download ONNX Runtime for Windows
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNXRUNTIME_VERSION }}/onnxruntime-win-x64-${{ env.ONNXRUNTIME_VERSION }}.zip"
          Invoke-WebRequest -Uri $url -OutFile "onnxruntime-win-x64.zip"
          Expand-Archive -Path "onnxruntime-win-x64.zip" -DestinationPath "onnxruntime-win-x64"

          # The zip may contain a root folder; flatten if needed
          $inner = Get-ChildItem -Path "onnxruntime-win-x64" -Directory | Where-Object { $_.Name -like "onnxruntime-win-x64*" } | Select-Object -First 1
          if ($inner) {
            Write-Host "Flattening nested directory: $($inner.Name)"
            Move-Item "$($inner.FullName)/*" "onnxruntime-win-x64/" -Force
            Remove-Item $inner.FullName
          }

          echo "ONNXRUNTIME_ROOT=${{ github.workspace }}\onnxruntime-win-x64" >> $env:GITHUB_ENV

          # vcpkg toolchain so CMake's find_package(CURL) works
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

          # Override bundled MinGW curl with vcpkg's MSVC-compatible curl
          echo "CURL_INCLUDE_DIR=C:\vcpkg\installed\x64-windows\include" >> $env:GITHUB_ENV
          echo "CURL_LIBRARY=C:\vcpkg\installed\x64-windows\lib\libcurl.lib" >> $env:GITHUB_ENV

          # vcpkg bin dir (for copying DLLs into the wheel)
          echo "VCPKG_BIN=C:\vcpkg\installed\x64-windows\bin" >> $env:GITHUB_ENV

      # ── Build the C++ shared library ─────────────────────────────
      - name: Build shared library
        if: runner.os != 'Linux' || runner.arch == 'X64'
        shell: bash
        env:
          ONNXRUNTIME_ROOT: ${{ env.ONNXRUNTIME_ROOT }}
          CURL_INCLUDE_DIR: ${{ env.CURL_INCLUDE_DIR }}
          CURL_LIBRARY: ${{ env.CURL_LIBRARY }}
        run: |
          mkdir -p build
          cd build
          cmake_args=(
            -DCMAKE_BUILD_TYPE=Release
            -DLIBEMBEDDING_BUILD_SHARED=ON
            -DLIBEMBEDDING_BUILD_TESTS=OFF
            -DLIBEMBEDDING_BUILD_EXAMPLES=OFF
            -DLIBEMBEDDING_BUILD_BENCHMARKS=OFF
            -DONNXRUNTIME_ROOT="$ONNXRUNTIME_ROOT"
          )
          if [ -n "$CURL_INCLUDE_DIR" ]; then
            cmake_args+=("-DCURL_INCLUDE_DIR=$CURL_INCLUDE_DIR")
          fi
          if [ -n "$CURL_LIBRARY" ]; then
            cmake_args+=("-DCURL_LIBRARY=$CURL_LIBRARY")
          fi
          if [ -n "$CURL_PREFIX" ]; then
            cmake_args+=("-DCMAKE_PREFIX_PATH=$CURL_PREFIX")
          fi
          if [ "$(uname)" = "Darwin" ]; then
            # Without a target, binaries require the runner's macOS version.
            # Metal is off: GPU is out of scope before 1.x (ggml enables it by
            # default on Apple platforms).
            cmake_args+=(
              "-DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOS_MIN_VERSION"
              "-DCMAKE_OSX_ARCHITECTURES=$(uname -m)"
              "-DGGML_METAL=OFF"
            )
          fi
          cmake .. "${cmake_args[@]}"
          # Limit parallel build on Linux/macOS to avoid OOM when compiling
          # the bundled llama.cpp with all models.
          if [ "$(uname)" = "Linux" ] || [ "$(uname)" = "Darwin" ]; then
            cmake --build . --parallel 2 --target embedding_shared --config Release
          else
            cmake --build . --parallel --target embedding_shared --config Release
          fi

      # ── Copy shared library into the Python package ──────────────
      - name: Copy shared libraries (Linux/macOS)
        if: runner.os == 'macOS' || (runner.os == 'Linux' && runner.arch == 'X64')
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ext=".so"
          else
            ext=".dylib"
          fi
          ort_lib_dir="$ONNXRUNTIME_ROOT/lib"

          cp "build/libembedding${ext}" python/src/libembedding/

          # On macOS, delocate vendors ONNX Runtime and the ggml/llama dylibs
          # under .dylibs/ from libembedding's own references; a copy here
          # would be a second, unused ONNX Runtime. libcurl is the system one.
          # On Linux, libcurl is linked in statically (no copy, nothing to graft).
          if [ "${{ runner.os }}" = "Linux" ]; then
            if objdump -p build/libembedding.so | grep -E 'NEEDED.*(curl|ssl|crypto)'; then
              echo "ERROR: libembedding.so links a system libcurl or TLS library"
              exit 1
            fi
            cp "${ort_lib_dir}/libonnxruntime${ext}" python/src/libembedding/ || true
            cp "${ort_lib_dir}/libonnxruntime_providers_shared${ext}" python/src/libembedding/ || true
          fi

          # ggml CPU variants (CPU dispatch, default ON on Linux). They are
          # dlopen()ed, never linked, so auditwheel/delocate cannot find them
          # by following libembedding's dependencies: they must be in the
          # package already, where auditwheel then repairs them like any other
          # shared object. macOS builds natively (dispatch OFF) and has none.
          shopt -s nullglob
          cpu_variants=(build/bin/libggml-cpu-*${ext})
          if [ "${{ runner.os }}" = "Linux" ] && [ ${#cpu_variants[@]} -eq 0 ]; then
            echo "ERROR: no libggml-cpu-*${ext} under build/bin"
            exit 1
          fi
          for lib in "${cpu_variants[@]}"; do
            cp "$lib" python/src/libembedding/
            echo "Vendored ggml CPU variant: $(basename "$lib")"
          done

          ls -la python/src/libembedding/

      - name: Copy shared library and onnxruntime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Prefer the real exported DLL; embedding.dll is a thin wrapper
          # and may not export all lembed_* symbols on Windows.
          if (Test-Path build/Release/libembedding.dll) {
            Write-Host "Using build/Release/libembedding.dll"
            Copy-Item build/Release/libembedding.dll python/src/libembedding/libembedding.dll -Force
          } else {
            $dll = Get-ChildItem -Path build -Recurse -Filter "libembedding.dll" | Select-Object -First 1
            if ($dll) {
              Write-Host "Found: $($dll.FullName)"
              Copy-Item $dll.FullName python/src/libembedding/libembedding.dll -Force
            } else {
              $dll = Get-ChildItem -Path build -Recurse -Filter "embedding.dll" | Select-Object -First 1
              if ($dll) {
                Write-Host "Found embedding.dll: $($dll.FullName)"
                Copy-Item $dll.FullName python/src/libembedding/libembedding.dll -Force
              } else {
                Write-Host "ERROR: no libembedding.dll or embedding.dll found under build"
                exit 1
              }
            }
          }

          # Vendor onnxruntime DLLs into the wheel so the package is self-contained
          # Search recursively since the archive layout may vary
          $ortDll = Get-ChildItem -Path ${{ env.ONNXRUNTIME_ROOT }} -Recurse -Filter "onnxruntime.dll" | Select-Object -First 1
          if ($ortDll) {
            Write-Host "Found onnxruntime.dll: $($ortDll.FullName)"
            Copy-Item $ortDll.FullName python/src/libembedding/ -Force
          } else {
            Write-Host "ERROR: onnxruntime.dll not found under ${{ env.ONNXRUNTIME_ROOT }}"
            Get-ChildItem -Path ${{ env.ONNXRUNTIME_ROOT }} -Recurse | Select-Object FullName | Write-Output
            exit 1
          }

          $ortProviders = Get-ChildItem -Path ${{ env.ONNXRUNTIME_ROOT }} -Recurse -Filter "onnxruntime_providers_shared.dll" | Select-Object -First 1
          if ($ortProviders) {
            Write-Host "Found onnxruntime_providers_shared.dll: $($ortProviders.FullName)"
            Copy-Item $ortProviders.FullName python/src/libembedding/ -Force
          } else {
            Write-Host "WARNING: onnxruntime_providers_shared.dll not found"
          }

          # Vendor ALL third-party DLLs from vcpkg (curl + dependencies like zlib, ssl, etc.)
          # This ensures the wheel is self-contained regardless of curl's dependency tree
          Get-ChildItem "${{ env.VCPKG_BIN }}" -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName python/src/libembedding/ -Force
            Write-Host "Vendored: $($_.Name)"
          }

          # Vendor llama.cpp runtime DLLs required by libembedding.dll
          $llamaDlls = @("llama.dll", "ggml.dll", "ggml-base.dll")
          foreach ($dll in $llamaDlls) {
            $src = Join-Path "build/bin/Release" $dll
            if (Test-Path $src) {
              Copy-Item $src python/src/libembedding/ -Force
              Write-Host "Vendored llama.cpp: $dll"
            } else {
              Write-Host "WARNING: $dll not found under build/bin/Release"
            }
          }

          # ggml CPU backend: one DLL per instruction-set level (CPU dispatch,
          # LIBEMBEDDING_CPU_DISPATCH=ON). ggml loads the best one for the
          # user's CPU from next to libembedding.dll; without any of them no
          # GGUF model can run, so their absence fails the build.
          $cpuDlls = Get-ChildItem "build/bin/Release" -Filter "ggml-cpu-*.dll"
          if (-not $cpuDlls) {
            Write-Host "ERROR: no ggml-cpu-*.dll under build/bin/Release"
            exit 1
          }
          foreach ($dll in $cpuDlls) {
            Copy-Item $dll.FullName python/src/libembedding/ -Force
            Write-Host "Vendored ggml CPU variant: $($dll.Name)"
          }

          Get-ChildItem python/src/libembedding/

      # ── Licence texts (PEP 639 license-files, see python/licenses/) ──
      # Linux aarch64 collects them inside its container script.
      - name: Collect third-party licence texts
        if: runner.os != 'Linux' || runner.arch == 'X64'
        shell: bash
        run: |
          extra=()
          if [ "${{ runner.os }}" = "Linux" ]; then
            extra+=("$CURL_PREFIX/share/licenses/curl/COPYING" curl.COPYING
                    "$CURL_PREFIX/share/licenses/mbedtls/LICENSE" mbedtls.LICENSE)
          elif [ "${{ runner.os }}" = "Windows" ]; then
            # vcpkg's curl port links libcurl.dll and z.dll (zlib), both vendored above.
            share="/c/vcpkg/installed/x64-windows/share"
            extra+=("$share/curl/copyright" curl.COPYING
                    "$share/zlib/copyright" zlib.LICENSE)
          fi
          bash scripts/collect_wheel_licenses.sh "${{ env.ONNXRUNTIME_VERSION }}" ${extra[@]+"${extra[@]}"}

      # ── Build the Python wheel ───────────────────────────────────
      - name: Build wheel
        if: runner.os != 'Linux' || runner.arch == 'X64'
        shell: bash
        run: |
          cd python
          if [ "$(uname)" = "Darwin" ]; then
            # setup-python's interpreter is universal2, so the wheel would be
            # tagged universal2 although the binaries are single-architecture,
            # and delocate refuses it. Tag the architecture actually built.
            export MACOSX_DEPLOYMENT_TARGET="$MACOS_MIN_VERSION"
            export _PYTHON_HOST_PLATFORM="macosx-${MACOS_MIN_VERSION}-$(uname -m)"
            export ARCHFLAGS="-arch $(uname -m)"
          fi
          python -m build --wheel --outdir dist/

      # ── Repair wheel: vendor onnxruntime into the wheel ──────────
      - name: Repair wheel with auditwheel (Linux)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          # Install newer patchelf (>=0.14.5) for auditwheel 6.8+
          wget -q https://github.com/NixOS/patchelf/releases/download/0.18.0/patchelf-0.18.0.tar.gz
          tar xzf patchelf-0.18.0.tar.gz
          cd patchelf-0.18.0
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          cd ..
          pip install auditwheel
          cd python/dist
          auditwheel repair *.whl -w .

      - name: Repair wheel with delocate (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install delocate
          cd python/dist
          # No `|| true`: a wheel delocate could not repair still loads its
          # dylibs through absolute rpaths into this runner's build tree, so it
          # passes every test here and is broken on any other machine.
          delocate-wheel --require-archs "$(uname -m)" -w repaired -v *.whl
          rm -f *.whl
          mv repaired/*.whl .
          rmdir repaired

          # Nothing may still point into the runner (build tree, downloads).
          mkdir check
          unzip -q *.whl -d check
          otool -l check/libembedding/*.dylib check/libembedding/.dylibs/*.dylib | grep -E "minos|path " || true
          if otool -L -l check/libembedding/*.dylib check/libembedding/.dylibs/*.dylib | grep -n "/Users/runner"; then
            echo "ERROR: the wheel still references the runner's file system"
            exit 1
          fi
          rm -rf check

      # Windows: onnxruntime DLLs already copied into the package above

      # ── Normalize wheel tags to py3-none (cffi ABI mode is
      #    Python-version-independent) ─────────────────────────────
      - name: Normalize wheel tags to py3-none
        shell: bash
        run: |
          cd python/dist
          for f in *.whl; do
            newname=$(echo "$f" | sed 's/cp3[0-9]*-cp3[0-9]*/py3-none/')
            if [ "$f" != "$newname" ]; then mv "$f" "$newname"; fi
          done
          ls -la

      - name: List wheel contents
        shell: bash
        run: |
          cd python/dist
          for f in *.whl; do
            echo "=== $f ==="
            python -m zipfile -l "$f"
          done

      # Every wheel carries the licence texts of what it bundles; a Linux wheel
      # grafts no libcurl (it is linked in statically) and macOS no Metal.
      - name: Check licence texts and bundled libraries
        shell: bash
        run: |
          python - "${{ runner.os }}" python/dist/*.whl <<'EOF'
          import sys, zipfile
          system, wheels = sys.argv[1], sys.argv[2:]
          required = ["LICENSE", "licenses/THIRD_PARTY_NOTICES.md", "licenses/onnxruntime.LICENSE",
                      "licenses/onnxruntime.ThirdPartyNotices.txt", "licenses/llama.cpp.LICENSE",
                      "licenses/cJSON.LICENSE", "licenses/stb.LICENSE"]
          required += {"Linux": ["licenses/curl.COPYING", "licenses/mbedtls.LICENSE"],
                       "Windows": ["licenses/curl.COPYING", "licenses/zlib.LICENSE"]}.get(system, [])
          forbidden = {"Linux": ["libcurl", "libssl", "libcrypto", "libgnutls"],
                       "macOS": ["libggml-metal"]}.get(system, [])
          failed = False
          for wheel in wheels:
              names = zipfile.ZipFile(wheel).namelist()
              licences = {n.split(".dist-info/licenses/", 1)[1] for n in names if ".dist-info/licenses/" in n}
              for item in required:
                  if item not in licences:
                      print(f"ERROR: {wheel} lacks the licence file {item}"); failed = True
              for name in names:
                  if any(f in name.rsplit("/", 1)[-1] for f in forbidden):
                      print(f"ERROR: {wheel} bundles {name}"); failed = True
              print(f"{wheel}: licences {sorted(licences)}")
          sys.exit(failed)
          EOF

      # ── Install wheel and run tests ──────────────────────────────
      - name: Install wheel and run tests
        shell: bash
        run: |
          cd python
          # Find and install the repaired wheel for the current platform
          if [ "$(uname)" = "Linux" ]; then
            WHEEL=$(ls dist/*manylinux*.whl 2>/dev/null | head -1)
          elif [ "$(uname)" = "Darwin" ]; then
            WHEEL=$(ls dist/*macosx*.whl 2>/dev/null | head -1)
          else
            WHEEL=$(ls dist/*win*.whl 2>/dev/null | head -1)
          fi
          if [ -z "$WHEEL" ]; then
            echo "No matching wheel found"
            ls -la dist/
            exit 1
          fi
          echo "Installing $WHEEL"
          pip install "$WHEEL"
          # Reinstall pytest (uninstalled by wheel install which has no dev deps)
          pip install pytest pytest-timeout pytest-cov

          # Test the installed wheel as a user gets it: without the build tree
          # and the downloaded ONNX Runtime, which absolute rpaths left in a
          # badly repaired wheel would otherwise still reach, and without the
          # source package that conftest.py puts first on sys.path.
          mv ../build ../build.moved
          if [ -n "$ONNXRUNTIME_ROOT" ] && [ -d "$ONNXRUNTIME_ROOT" ]; then
            mv "$ONNXRUNTIME_ROOT" "$ONNXRUNTIME_ROOT.moved"
          fi
          export LIBEMBEDDING_TEST_INSTALLED=1
          (cd "$RUNNER_TEMP" && python -c "import libembedding, sys; print('Testing', libembedding.__file__); sys.exit('site-packages' not in libembedding.__file__)")
          pytest tests/ -v --timeout=120 --cov=libembedding --cov-fail-under=40

      # ── Upload repaired wheel as artifact ─────────────────────────────
      - name: Upload repaired wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ inputs.os }}
          if-no-files-found: error
          path: |
            python/dist/*manylinux*.whl
            python/dist/*macosx*.whl
            python/dist/*win*.whl

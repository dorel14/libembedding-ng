# Semantic-release configuration for the libembedding-ng project.
# Forked from https://github.com/pacifio/libembedding.
# The Python package is published on PyPI as `libembedding-ng` (see python/pyproject.toml).
[tool.semantic_release]
version_toml = [
    "python/pyproject.toml:project.version",
]
version_variables = [
    "CMakeLists.txt:LIBEMBEDDING_VERSION",
    "include/libembedding/config.h:LIBEMBEDDING_VERSION_STRING",
]
version_source = "commit"
branch = "main"
commit_parser = "conventional"
major_on_zero = true
initial_version = "0.1.0"
changelog = { template = "conventional" }
upload_to_pypi = false
upload_to_vcs_release = true
commit_message = "{version}\n\nAutomatically generated by python-semantic-release\n\n[skip ci]"

[tool.pyright]
include = ["python/src"]
exclude = [
    "**/__pycache__",
    "**/build",
    "**/dist",
    "**/*.egg-info",
]
verboseOutput = false
pythonVersion = "3.9"
typeCheckingMode = "basic"
# cffi generates dynamic types that pyright cannot infer
reportAttributeAccessIssue = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs = "none"
reportAssignmentType = "none"
reportPossiblyUnboundVariable = "none"
